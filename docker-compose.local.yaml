services:
  db:
    image: mysql:8
    container_name: mysql
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/docker-entrypoint-initdb.d:ro
    ports:
      - "4306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    env_file:
      - ./backend/.env
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - HOST=0.0.0.0
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
